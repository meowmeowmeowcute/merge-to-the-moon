<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1030">
  <title>月餅合成 Merge to the Moon</title>
  <meta name="description" content="從芝麻開始，一路合成到月亮！中秋像素風物理合成小遊戲。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-box">
        <span class="hud-label">分數</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">最高</span>
        <span id="best" class="hud-value">0</span>
      </div>
      <div class="hud-box hud-next">
        <span class="hud-label">下一個</span>
        <canvas id="next" width="36" height="36"></canvas>
      </div>
    </header>

    <main id="stage">
      <div class="frame">
        <canvas id="game"></canvas>

        <section id="overlay-start" class="overlay">
          <h1 class="title">月餅合成</h1>
          <p class="subtitle">Merge to the Moon</p>
          <p class="hint">相同的兩個碰在一起就會合成<br>從芝麻一路合成到 🌕 月亮！</p>
          <button id="btn-start" class="pixel-btn">開始</button>
          <p class="small">最高分 <span id="start-best">0</span></p>
        </section>

        <section id="overlay-over" class="overlay" hidden>
          <h2 class="title">遊戲結束</h2>
          <p id="over-record" class="record" hidden>新紀錄！</p>
          <p class="big">分數 <span id="over-score">0</span></p>
          <p class="small">最高分 <span id="over-best">0</span></p>
          <div class="over-tier">
            <canvas id="over-tier" width="64" height="64"></canvas>
            <span>最高合成：<span id="over-tier-name">—</span></span>
          </div>
          <button id="btn-restart" class="pixel-btn">再一局</button>
        </section>
      </div>
    </main>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
